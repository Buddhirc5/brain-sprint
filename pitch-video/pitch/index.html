        --lime: #c6f432;
        --orange: #ff5a1f;
        --yellow: #ffd84d;
        --grey: #d6d6d2;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; font-family: "Figtree", sans-serif; color: var(--ink); }
      .bg { position: absolute; inset: 0; background: var(--paper); }

      /* shared pieces used by every scene */
      .ttl { font-family: "Anton", sans-serif; font-weight: 400; text-transform: uppercase; line-height: 0.95; letter-spacing: -0.005em; color: var(--ink); }
      .ttl .w { display: inline-block; }
      .sub { font-family: "Figtree", sans-serif; font-weight: 650; font-size: 40px; line-height: 1.2; color: var(--ink); }
      .hl { background: var(--lime); padding: 0 0.12em; border-radius: 0.08em; }
      .phone { position: absolute; width: 444px; height: 928px; border-radius: 64px; background: var(--ink); padding: 14px; box-shadow: 0 30px 60px rgba(22, 21, 18, 0.18); }
      .phone .scr { position: relative; width: 416px; height: 900px; border-radius: 52px; overflow: hidden; background: var(--paper); }
      .phone .scr img { position: absolute; left: 0; top: 0; width: 416px; height: auto; }
      .tap { position: absolute; width: 74px; height: 74px; margin: -37px 0 0 -37px; border-radius: 50%; background: rgba(22, 21, 18, 0.28); border: 4px solid rgba(255, 255, 255, 0.9); }
      .chip { display: inline-block; font: 700 34px "Figtree", sans-serif; padding: 12px 26px; border-radius: 999px; background: #fff; color: var(--ink); border: 3px solid var(--ink); }
    </style>
  </head>
