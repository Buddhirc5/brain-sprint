  <script>
    const tl = gsap.timeline({ paused: true });
    const D = 1.42;
    const shots = gsap.utils.toArray(".sh");
    shots.forEach((sh, k) => {
      const t = k * D;
      if (k) tl.fromTo(sh, { opacity: 0 }, { opacity: 1, duration: 0.01 }, t);
      if (k) tl.to(shots[k - 1], { opacity: 0, duration: 0.01 }, t + 0.02);
      const word = sh.querySelector("h2");
      tl.fromTo(word, { opacity: 0, filter: "blur(10px)", scale: 1.12 }, { opacity: 1, filter: "blur(0px)", scale: 1, duration: 0.16, ease: "power3.out" }, t + 0.02);
      const ph = sh.querySelector(".phone");
      if (ph) tl.fromTo(ph, { y: 140 }, { y: 0, duration: 0.45, ease: "expo.out" }, t);
      const sc = sh.querySelector(".scrn");
      if (sc) tl.fromTo(sc, { y: 260 }, { y: 0, duration: 0.5, ease: "expo.out" }, t);
    });
    // collect: the kit assembles in the beat
    tl.fromTo("#t2-me", { y: -700 }, { y: 0, duration: 0.4, ease: "back.out(1.4)" }, 3 * D);
    tl.fromTo("#t2-ride", { x: -700 }, { x: 0, duration: 0.4, ease: "expo.out" }, 3 * D + 0.3);
    tl.fromTo("#t2-pet", { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, ease: "back.out(1.8)" }, 3 * D + 0.55);
    window.__timelines["t2"] = tl;
