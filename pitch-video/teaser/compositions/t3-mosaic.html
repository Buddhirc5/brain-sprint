<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; background: var(--paper); }
    #t3-all { position: absolute; inset: 0; background: var(--ink); }
    #t3-grid { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(2, 1fr); gap: 10px; padding: 10px; }
    .tile { position: relative; overflow: hidden; border-radius: 16px; background: var(--paper); }
    .tile img { position: absolute; left: 50%; top: 0; width: 100%; height: auto; transform: translateX(-50%); }
    .tile.ph img { width: 300px; top: -20px; }
    .tile.dk img { width: 840px; left: 0; transform: none; }
    #t3-band { position: absolute; left: 0; right: 0; top: 430px; height: 220px; background: var(--lime); display: flex; align-items: center; justify-content: center; }
    #t3-line { font-size: 150px; color: var(--ink); }
  </style>
  <div id="root" data-composition-id="t3" data-width="1920" data-height="1080">
    <div id="t3-all">
    <div id="t3-grid">
      <div class="tile ph"><img src="assets/shots/lobby.png" alt="" /></div>
      <div class="tile dk"><img src="assets/shots/live-board.png" alt="" /></div>
      <div class="tile ph"><img src="assets/shots/story-cover.png" alt="" /></div>
      <div class="tile ph"><img src="assets/shots/store-pets.png" alt="" /></div>
      <div class="tile ph"><img src="assets/shots/bucket-picked.png" alt="" /></div>
      <div class="tile dk"><img src="assets/shots/cert.png" alt="" /></div>
      <div class="tile ph"><img src="assets/shots/map-0.png" alt="" /></div>
      <div class="tile ph"><img src="assets/shots/sprint-reveal-1.png" alt="" /></div>
    </div>
    <div id="t3-band"><h2 id="t3-line" class="ttl">All in one. Your brand.</h2></div>
    </div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    gsap.utils.toArray(".tile").forEach((t, i) =>
      tl.fromTo(t, { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.3, ease: "expo.out" }, i * 0.05)
    );
    tl.fromTo("#t3-band", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "expo.out" }, 0.45);
    tl.fromTo("#t3-line", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.16 }, 0.6);
    // everything collapses to the centre, where the mark will land
    tl.to("#t3-all", { scale: 0.05, opacity: 0, duration: 0.35, ease: "power3.in" }, 1.85);
    window.__timelines["t3"] = tl;
  </script>
</template>
