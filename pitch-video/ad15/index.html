<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton-400.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Figtree"; src: url("assets/fonts/figtree-var.woff2") format("woff2"); font-weight: 300 900; }
      :root { --ink: #161512; --lime: #c6f432; --orange: #ff5a1f; --yellow: #ffd84d; --white: #ffffff; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #fff; font-family: "Figtree", sans-serif; color: var(--ink); }
      .scene { position: absolute; inset: 0; overflow: hidden; visibility: hidden; background: #fff; }
      .abs { position: absolute; }
      svg.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
      .eng { mix-blend-mode: multiply; }
      .paint { fill: none; stroke-linecap: round; stroke-linejoin: round; }

      /* the hero dot: lime, ink rim — a game token */
      #dot { position: absolute; left: 0; top: 0; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; background: var(--lime); border: 7px solid var(--ink); z-index: 50; visibility: hidden; }

      /* morphing words: every letter has its true Anton advance, so reflow is exact */
      .word { position: absolute; left: 540px; display: flex; isolation: isolate; font-family: "Anton", sans-serif; line-height: 1.35em; height: 1.35em; white-space: nowrap; color: var(--ink); }
      .word .lt { position: relative; display: block; height: 1.35em; flex: none; }
      .word .lt i { display: block; font-style: normal; height: 1.35em; }
      .word .lt.roll { overflow: hidden; }
      .word .lt.roll .col { display: block; }
      .word .hl { position: absolute; left: 0.04em; right: -0.04em; top: 0.72em; height: 0.34em; background: var(--lime); z-index: -1; transform-origin: 0 50%; }

      /* mosaic cards */
      .card { position: absolute; overflow: hidden; }
      .card img { position: absolute; display: block; }

      /* phone */
      #phone { position: absolute; left: 270px; top: 400px; width: 540px; height: 1122px; border-radius: 78px; background: var(--ink); padding: 20px; }
      #phone .scr { position: relative; width: 500px; height: 1082px; border-radius: 60px; overflow: hidden; background: #f4f3ee; }
      #phone .scr img { position: absolute; left: 0; top: 0; width: 500px; height: 1082px; }

      /* 3D logo tile */
      #logoStage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; perspective: 1700px; perspective-origin: 540px 860px; }
      #logo3d { position: absolute; left: 320px; top: 640px; width: 440px; height: 440px; transform-style: preserve-3d; }
      #logo3d .layer { position: absolute; inset: 0; border-radius: 103px; background: #2b2a26; }
      #logo3d .front { position: absolute; inset: 0; border-radius: 103px; border: 7px solid var(--ink); overflow: hidden; background: #fffefa; backface-visibility: hidden; }
      #logo3d .front img { position: absolute; left: -7px; top: -7px; width: 440px; height: 440px; }
      #logo3d .back { position: absolute; inset: 0; border-radius: 103px; background: var(--lime); backface-visibility: hidden; }
      #wordmark { position: absolute; left: 0; right: 0; top: 1150px; text-align: center; font-family: "Anton", sans-serif; font-size: 172px; line-height: 1.2; letter-spacing: 0.015em; }
      #wordmark span { display: inline-block; }
      #endline { position: absolute; left: 0; right: 0; top: 1395px; text-align: center; font: 700 52px "Figtree", sans-serif; letter-spacing: -0.01em; }
      #endline b { display: inline-block; width: 26px; height: 26px; border-radius: 50%; background: var(--lime); border: 4px solid var(--ink); margin-left: 6px; vertical-align: -1px; }
      .chip { position: absolute; font-family: "Anton", sans-serif; font-size: 104px; line-height: 1; padding: 18px 34px 22px; border-radius: 26px; background: var(--lime); color: var(--ink); white-space: nowrap; }
    </style>
  </head>

    <script>

        const out = [];
        for (const s of spec) {
          const sp = document.createElement("span");

            sp.classList.add("roll");

            sp.innerHTML = `<span class="col"><i>${s[0]}</i><i>${s[1]}</i></span>`;
            sp.dataset.to = ADV[s[1]];
          } else if (s[0] === "+") {
            sp.style.width = "0em";
            sp.innerHTML = `<i>${s[1]}</i>`;
            sp.dataset.to = ADV[s[1]];

          el.appendChild(sp);
          out.push(sp);

      }
      // smooth closed-ish loop through wobbly radii (Catmull-Rom → cubic)
      function loopPath(cx, cy, rx, ry, turns, start, wob, seed) {
        const n = Math.round(28 * turns), pts = [];
        for (let k = 0; k <= n; k++) {
          const a = start + (k / n) * turns * Math.PI * 2;
          const w = 1 + wob * Math.sin(k * 1.7 + seed) * Math.cos(k * 0.6 + seed * 2);
          pts.push([cx + Math.cos(a) * rx * w, cy + Math.sin(a) * ry * w]);

        let d = `M ${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;

          const p0 = pts[Math.max(0, k - 1)], p1 = pts[k], p2 = pts[k + 1], p3 = pts[Math.min(pts.length - 1, k + 2)];

      draw("#scrib", 9.1, 0.4, "power1.inOut");
      tl.fromTo("#w3", { y: 160, filter: "blur(12px)", opacity: 0 }, { y: 0, filter: "blur(0px)", opacity: 1, duration: 0.24, ease: "expo.out" }, 9.12);
      tl.to(w3[0].firstChild, { y: "-1.35em", duration: 0.2, ease: "power3.inOut" }, 9.5);
      tl.to(w3[0].firstChild, { keyframes: [{ filter: "blur(7px)", duration: 0.1 }, { filter: "blur(0px)", duration: 0.1 }], ease: "none" }, 9.5);
      tl.to(w3[0], { width: w3[0].dataset.to + "em", duration: 0.2, ease: "power3.inOut" }, 9.5);
      tl.fromTo("#w3 .hl", { scaleX: 0, skewX: -8 }, { scaleX: 1, skewX: -8, duration: 0.2, ease: "power3.out" }, 9.6);
      draw("#zap", 9.58, 0.14, "power2.out");

      /* ---------- S11 · 10.00–12.00 · learning → now playing ---------- */
      const w4 = word($("#w4"), ["+p", "l", "e", "a", ["r", "y"], "n", "i", "n", "g"], true);
      const w5 = word($("#w5"), ["n", "o", "w"]);
      show("#s11", 10.0, 12.05);
      w4.forEach((l, k) => tl.fromTo(l.firstChild, { y: 220, opacity: 0, filter: "blur(10px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.3, ease: "expo.out" }, 10.0 + k * 0.025));
      tl.set(w4[0].firstChild, { opacity: 0, y: 0, scale: 0, transformOrigin: "0% 76%" }, 10.02);
      const out = (sp, t) => {
        tl.to(sp, { width: "0em", duration: 0.26, ease: "power3.inOut" }, t);
        tl.to(sp.firstChild, { scale: 0, opacity: 0, transformOrigin: "0% 76%", duration: 0.26, ease: "power3.inOut" }, t);
      };
      tl.to(w4[0], { width: w4[0].dataset.to + "em", duration: 0.28, ease: "power3.inOut" }, 10.5);
      tl.to(w4[0].firstChild, { scale: 1, opacity: 1, duration: 0.28, ease: "power3.inOut" }, 10.5);
      out(w4[2], 10.5);
      tl.to(w4[4].firstChild, { y: "-1.35em", duration: 0.26, ease: "power3.inOut" }, 10.56);
      tl.to(w4[4].firstChild, { keyframes: [{ filter: "blur(7px)", duration: 0.13 }, { filter: "blur(0px)", duration: 0.13 }], ease: "none" }, 10.56);
      tl.to(w4[4], { width: w4[4].dataset.to + "em", duration: 0.26, ease: "power3.inOut" }, 10.56);
      out(w4[5], 10.6);
      tl.fromTo("#w5", { y: -900, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.3, ease: "expo.out" }, 10.95);
      tl.fromTo("#w4", { y: 0 }, { y: 70, duration: 0.3, ease: "expo.out" }, 10.95);
      tl.fromTo("#w4 .hl", { scaleX: 0, skewX: -8 }, { scaleX: 1, skewX: -8, duration: 0.22, ease: "power3.out" }, 11.1);
      // period: the token lands, then turns into a play button
      tl.set(D, { visibility: "visible", x: 1000, y: 1060, scale: 0 }, 11.12);
      tl.to(D, { scale: 1, duration: 0.14, ease: "back.out(3)" }, 11.12);
      tl.to(D, { scale: 0, duration: 0.08, ease: "power2.in" }, 11.3);
      tl.set(D, { visibility: "hidden" }, 11.38);
      tl.fromTo("#play", { x: 1000, y: 1060, scale: 0, rotation: -90 }, { x: 1000, y: 1060, scale: 1, rotation: 0, duration: 0.2, ease: "back.out(2.4)" }, 11.32);
      tl.to("#play", { strokeWidth: 0, duration: 0.08 }, 11.72);
      tl.to("#play", { x: 600, y: 960, scale: 48, duration: 0.3, ease: "power3.in" }, 11.75);

      /* ---------- S12 · 12.00–14.80 · the mark ---------- */
      {
        const L = $("#logo3d");
        for (let k = 15; k >= 1; k--) {
          const d = document.createElement("div");
          d.className = "layer";
          d.style.transform = `translateZ(${-k * 2.6}px)`;
          d.style.background = k === 15 ? "#161512" : "#2b2a26";
          L.appendChild(d);
        }
        const b = document.createElement("div"); b.className = "back"; b.style.transform = "translateZ(-40px) rotateY(180deg)"; L.appendChild(b);
        const f = document.createElement("div"); f.className = "front"; f.innerHTML = '<img src="assets/art/logo-mark.svg" alt="Ant Arena logo" />'; L.appendChild(f);
        const wm = $("#wordmark");
        "ANT ARENA".split("").forEach((c) => { const s = document.createElement("span"); s.textContent = c === " " ? " " : c; wm.appendChild(s); });
      }
      show("#s12", 12.0);
      tl.set("#s12", { background: "#c6f432" }, 12.0);
      tl.set("#s12", { background: "#ffffff" }, 12.04);
      tl.fromTo("#logo3d", { scale: 6.2, rotationY: 180, rotationX: 0 }, { scale: 1, duration: 0.34, ease: "power3.inOut" }, 12.04);
      tl.to("#logo3d", { rotationY: 360, duration: 0.7, ease: "back.out(1.25)" }, 12.3);
      tl.fromTo("#shadow", { opacity: 0, scaleX: 0.4 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, 12.4);
      document.querySelectorAll("#wordmark span").forEach((s, k) =>
        tl.fromTo(s, { y: 120, opacity: 0, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.36, ease: "expo.out" }, 12.72 + k * 0.035));
      tl.fromTo("#endline", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.36, ease: "power3.out" }, 12.98);
      tl.fromTo("#endDot", { scale: 0 }, { scale: 1, duration: 0.24, ease: "back.out(3)" }, 13.24);
      tl.to("#logo3d", { y: -12, rotationY: 372, duration: 2.0, ease: "sine.inOut" }, 13.0);
    </script>
  </body>
</html>
