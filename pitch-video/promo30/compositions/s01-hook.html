  <div id="root" data-composition-id="s01" data-width="1920" data-height="1080">

    <div id="s1-l1" class="kin">
      <span class="w">Training</span><span class="w">took</span><span class="w">an</span><span class="w k">hour.<i class="u"></i></span>
    </div>
    <div id="s1-l2" class="kin">

    <div id="s1-spark" class="spark"></div>

  <script>
    const tl = gsap.timeline({ paused: true });
    const blurIn = (el, t) => tl.fromTo(el, { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.14, ease: "power2.out" }, t);
    // the dome of light rises under the dark ground
    tl.fromTo("#s1-dome", { y: 90, opacity: 0.55 }, { y: 0, opacity: 1, duration: 1.2, ease: "power2.out" }, 0);
    // the spark crosses line 1 and writes it as it passes
    tl.fromTo("#s1-spark", { x: 520, y: 450 }, { x: 1420, y: 440, duration: 1.15, ease: "power1.inOut" }, 0.1);
    const w1 = document.querySelectorAll("#s1-l1 .w");
    [0.16, 0.58, 0.8, 0.93].forEach((t, i) => blurIn(w1[i], t));
    tl.fromTo("#s1-l1 .u", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, 1.12);
    // line 1 leaves, the spark swings back and writes line 2
    tl.to("#s1-l1", { opacity: 0, filter: "blur(10px)", duration: 0.18, ease: "power2.in" }, 1.48);
    tl.to("#s1-spark", { x: 640, y: 470, duration: 0.3, ease: "power2.inOut" }, 1.3);
    tl.to("#s1-spark", { x: 1320, y: 445, duration: 0.7, ease: "power1.inOut" }, 1.62);
    const w2 = document.querySelectorAll("#s1-l2 .w");
    [1.66, 1.86, 2.02, 2.12].forEach((t, i) => blurIn(w2[i], t));
    tl.fromTo("#s1-l2 .u", { scaleX: 0 }, { scaleX: 1, duration: 0.3, ease: "expo.out" }, 2.3);
    // burst: the spark flies to the centre and swallows the frame
    tl.to("#s1-l2", { opacity: 0, filter: "blur(12px)", duration: 0.16, ease: "power2.in" }, 2.66);
    tl.to("#s1-spark", { x: 960, y: 560, duration: 0.2, ease: "power2.inOut" }, 2.5);
    // a clean disc (no glow to scale) grows out of the spark and fills the frame
    tl.fromTo("#s1-burst", { scale: 0.3 }, { scale: 32, duration: 0.3, ease: "power3.in" }, 2.7);
    tl.to("#s1-spark", { scale: 3, opacity: 0, duration: 0.15, ease: "power2.in" }, 2.72);
    window.__timelines["s01"] = tl;
